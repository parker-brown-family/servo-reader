name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        # setup-uv stopped publishing moving major tags at v8, so the newest major
        # (v10) is referenced by its exact, immutable release tag.
        uses: astral-sh/setup-uv@v10.3.1
        with:
          python-version: ${{ matrix.python-version }}

      # No lockfile yet: servo-agent floats on its main branch until that is decided.
      - name: Sync deps
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Tests
        run: uv run pytest -v
